# ApaKabaR gateway di GKE (namespace hkbp). DRAF — belum diterapkan.
# Prasyarat (lihat docs/DEPLOY.md): database `apakabar` di Postgres produksi, Secret `apakabar-secret`,
# gambar di Artifact Registry, DNS + sertifikat untuk host di HTTPRoute.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apakabar-gateway
  namespace: hkbp
  labels: { app: apakabar-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: apakabar-gateway }
  strategy:
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
    type: RollingUpdate
  template:
    metadata:
      labels: { app: apakabar-gateway }
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: hkbp-api-sa # sama dengan superapp: akses bucket GCS lewat Workload Identity
      nodeSelector:
        cloud.google.com/compute-class: pd-balanced-small
      containers:
        - name: gateway
          image: asia-southeast2-docker.pkg.dev/hkbp-superapp-prod/hkbp-superapp/apakabar-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3101
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3101" }
            - { name: TRUST_PROXY, value: "1" }
            - { name: OTP_PENGIRIM, value: whatsapp }
            # Lampiran terenkripsi disimpan di bucket GCS yang sama dengan superapp, awalan apakabar/berkas/
            - { name: GCS_BUCKET_NAME, value: hkbp-superapp-assets }
            - { name: GCP_PROJECT_ID, value: hkbp-superapp-prod }
            - { name: FIREBASE_KEY_PATH, value: /secrets/firebase/firebase-key.json }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=384" }
          envFrom:
            # DATABASE_URL, REDIS_URL, JWT_SECRET, OTP_SECRET, WA_TOKEN, WA_PHONE_ID, WA_TEMPLATE_OTP
            - secretRef: { name: apakabar-secret }
          volumeMounts:
            - { name: firebase, mountPath: /secrets/firebase, readOnly: true }
          readinessProbe:
            tcpSocket: { port: 3101 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3101 }
            periodSeconds: 20
            failureThreshold: 6
          startupProbe:
            tcpSocket: { port: 3101 }
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 640Mi }
          securityContext:
            capabilities: { drop: [NET_RAW] }
      volumes:
        - name: firebase
          secret: { secretName: apakabar-firebase, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: apakabar-gateway
  namespace: hkbp
  labels: { app: apakabar-gateway }
spec:
  selector: { app: apakabar-gateway }
  ports:
    - { name: http, port: 80, targetPort: 3101 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apakabar-route
  namespace: hkbp
spec:
  hostnames: ["apakabar.hkbp.or.id"] # GANTI bila memakai host lain; wajib tercakup sertifikat gateway
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: hkbp-gateway, sectionName: https }
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs:
        - { group: "", kind: Service, name: apakabar-gateway, port: 80 }
---
# Tanpa ini, load balancer GKE memutus WebSocket setelah 30 detik (batas waktu bawaan).
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: apakabar-gateway
  namespace: hkbp
spec:
  default:
    timeoutSec: 3600
  targetRef:
    group: ""
    kind: Service
    name: apakabar-gateway
---
# Migrasi Prisma. Dijalankan MANUAL (kubectl create -f) dengan DATABASE_URL langsung ke Postgres,
# bukan lewat pgbouncer (pgbouncer tidak bisa `migrate deploy`). Isi DATABASE_URL_LANGSUNG di apakabar-secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: apakabar-migrasi
  namespace: hkbp
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrasi
          image: asia-southeast2-docker.pkg.dev/hkbp-superapp-prod/hkbp-superapp/apakabar-gateway:latest
          command: ["sh", "-c", "DATABASE_URL=$DATABASE_URL_LANGSUNG npx prisma migrate deploy"]
          envFrom:
            - secretRef: { name: apakabar-secret }
